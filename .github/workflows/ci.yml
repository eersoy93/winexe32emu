name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
      - name: Lint (ruff.toml)
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests/python -v

  emulator-tests:
    name: Emulator tests (MinGW-w64 test programs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MinGW-w64 (i686)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile the apps
        run: sh scripts/compile_apps.sh
      - name: Compile and run the test programs
        # Exit code: number of failed tests
        run: python winexe32emu.py --tests
